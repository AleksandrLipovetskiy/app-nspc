name: CI - Build and Push Docker Image

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'Dockerfile'
      - 'index.html'
      - 'style.css'
      - 'logik.js'
      - '.github/workflows/ci.yml'
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY_URL: cr.yandex
  IMAGE_NAME: app-nspc

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Аутентификация через json_key сервисного аккаунта —  не протухает в отличие от IAM-токена
      - name: Log in to Yandex Container Registry
        uses: docker/login-action@v3
        with:
          registry: cr.yandex
          username: json_key
          password: ${{ secrets.YC_SERVICE_ACCOUNT_KEY }}
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: cr.yandex/${{ secrets.REGISTRY_ID }}/app-nspc:${{ github.sha }}

      - name: Compute image tags
        id: meta
        run: |
          FOLDER_ID="${{ secrets.YC_FOLDER_ID }}"
          BASE="${{ env.REGISTRY_URL }}/${FOLDER_ID}/${{ env.IMAGE_NAME }}"
          SHORT_SHA="${GITHUB_SHA:0:7}"

          # Всегда пушим тег по short SHA и latest
          TAGS="${BASE}:${SHORT_SHA}"$'\n'"${BASE}:latest"

          # Если запуск по тегу v* — добавляем версионный тег
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
            TAGS="${TAGS}"$'\n'"${BASE}:${VERSION}"
            echo "version=${VERSION}" >> $GITHUB_OUTPUT
          fi

          echo "tags<<EOF" >> $GITHUB_OUTPUT
          echo "${TAGS}" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "base=${BASE}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "### ✅ Docker image pushed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:**" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
