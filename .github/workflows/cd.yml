name: CD - Deploy to Kubernetes on Release Tag

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to deploy (e.g., v1.0.0)'
        required: true

env:
  REGISTRY_URL: cr.yandex
  IMAGE_NAME: app-nspc
  NAMESPACE: app-nspc

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine version tag
        id: tag
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="${{ github.event.inputs.tag }}"
          fi
          FOLDER_ID="${{ secrets.YC_FOLDER_ID }}"
          IMAGE="${{ env.REGISTRY_URL }}/${FOLDER_ID}/${{ env.IMAGE_NAME }}:${VERSION}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "image=${IMAGE}" >> $GITHUB_OUTPUT
          echo "Deploying image: ${IMAGE}"

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Install Yandex Cloud CLI
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash
          echo "$HOME/yandex-cloud/bin" >> $GITHUB_PATH

      - name: Configure Yandex Cloud and get kubeconfig
        run: |
          # Используем ключ сервисного аккаунта — не протухает
          echo '${{ secrets.YC_SERVICE_ACCOUNT_KEY }}' > /tmp/sa-key.json
          $HOME/yandex-cloud/bin/yc config set service-account-key /tmp/sa-key.json
          $HOME/yandex-cloud/bin/yc config set cloud-id "${{ secrets.YC_CLOUD_ID }}"
          $HOME/yandex-cloud/bin/yc config set folder-id "${{ secrets.YC_FOLDER_ID }}"
          $HOME/yandex-cloud/bin/yc managed-kubernetes cluster get-credentials \
            app-nspc-cluster --region ru-central1 --external --force

      - name: Create or update docker-registry secret
        run: |
          # Получаем свежий IAM-токен через сервисный аккаунт (для pull образов)
          IAM_TOKEN=$($HOME/yandex-cloud/bin/yc iam create-token)
          kubectl create namespace ${{ env.NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret docker-registry regcred \
            --docker-server=cr.yandex \
            --docker-username=iam \
            --docker-password="${IAM_TOKEN}" \
            --namespace=${{ env.NAMESPACE }} \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy via Kubernetes manifests
        run: |
          FOLDER_ID="${{ secrets.YC_FOLDER_ID }}"
          VERSION="${{ steps.tag.outputs.version }}"
          IMAGE="${{ steps.tag.outputs.image }}"

          # Подставляем реальный folder_id и тег версии в манифест
          sed \
            -e "s|cr.yandex/<folder-id>/app-nspc:latest|${IMAGE}|g" \
            -e "s|version: v1|version: ${VERSION}|g" \
            k8s/deployment.yaml | kubectl apply -f -

          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/service.yaml

          # Убеждаемся, что imagePullSecrets прописан
          kubectl patch deployment app-nspc -n ${{ env.NAMESPACE }} \
            --type='json' \
            -p='[{"op":"add","path":"/spec/template/spec/imagePullSecrets","value":[{"name":"regcred"}]}]' \
            2>/dev/null || true

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/app-nspc \
            -n ${{ env.NAMESPACE }} --timeout=5m

      - name: Deployment summary
        run: |
          echo "### 🚀 Deployment complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** \`${{ steps.tag.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ steps.tag.outputs.image }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Pods:**" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          kubectl get pods -n ${{ env.NAMESPACE }} >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Service (LoadBalancer IP):**" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          kubectl get svc app-nspc -n ${{ env.NAMESPACE }} >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      - name: Cleanup
        if: always()
        run: rm -f /tmp/sa-key.json
