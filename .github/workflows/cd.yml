name: CD - Deploy to Kubernetes on Release Tag

on:
  workflow_run:
    workflows: ["CI - Build and Push Docker Image"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to deploy (e.g., v1.0.0)'
        required: true

env:
  REGISTRY_URL: cr.yandex
  IMAGE_NAME: app-nspc
  NAMESPACE: app-nspc

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Важно: получаем именно тот коммит что собирал CI
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Determine version tag
        id: tag
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ github.event.inputs.tag }}"
          else
            # Ищем тег v* указывающий на SHA коммита из CI
            VERSION=$(git tag --points-at "${{ github.event.workflow_run.head_sha }}" \
              | grep '^v' | head -n1)
          fi

          if [[ -z "$VERSION" ]]; then
            echo "No version tag found for this commit, skipping deploy."
            exit 0  # мягкий выход без ошибки — это просто push на ветку, не тег
          fi

          REGISTRY_ID="${{ secrets.REGISTRY_ID }}"
          IMAGE="${{ env.REGISTRY_URL }}/${REGISTRY_ID}/${{ env.IMAGE_NAME }}:${VERSION}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "image=${IMAGE}" >> $GITHUB_OUTPUT
          echo "Deploying image: ${IMAGE}"

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Install Yandex Cloud CLI
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash
          echo "$HOME/yandex-cloud/bin" >> $GITHUB_PATH

      - name: Configure Yandex Cloud and get kubeconfig
        run: |
          echo '${{ secrets.YC_SERVICE_ACCOUNT_KEY }}' > /tmp/sa-key.json
          $HOME/yandex-cloud/bin/yc config set service-account-key /tmp/sa-key.json
          $HOME/yandex-cloud/bin/yc config set cloud-id "${{ secrets.YC_CLOUD_ID }}"
          $HOME/yandex-cloud/bin/yc config set folder-id "${{ secrets.YC_FOLDER_ID }}"
          $HOME/yandex-cloud/bin/yc managed-kubernetes cluster get-credentials \
            app-nspc-cluster --external --force

      - name: Create or update docker-registry secret
        run: |
          IAM_TOKEN=$($HOME/yandex-cloud/bin/yc iam create-token)
          kubectl create namespace ${{ env.NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret docker-registry ycr-secret \
            --docker-server=cr.yandex \
            --docker-username=iam \
            --docker-password="${IAM_TOKEN}" \
            --namespace=${{ env.NAMESPACE }} \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy via Kubernetes manifests
        run: |
          VERSION="${{ steps.tag.outputs.version }}"
          IMAGE="${{ steps.tag.outputs.image }}"

          kubectl apply -f k8s/namespace.yaml

          sed \
            -e "s|image: cr\.yandex/[^/]*/app-nspc:[^ ]*|image: ${IMAGE}|g" \
            -e "s|version: v[0-9.]*|version: ${VERSION}|g" \
            k8s/deployment.yaml | kubectl apply -f -

          kubectl apply -f k8s/service.yaml

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/app-nspc \
            -n ${{ env.NAMESPACE }} --timeout=5m

      - name: Wait for LoadBalancer IP
        run: |
          echo "Waiting for External IP..."
          for i in $(seq 1 18); do
            IP=$(kubectl get svc app-nspc -n ${{ env.NAMESPACE }} \
              -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null)
            if [[ -n "$IP" ]]; then
              echo "External IP: $IP"
              echo "lb_ip=${IP}" >> $GITHUB_ENV
              break
            fi
            echo "Attempt $i/18: not yet assigned, waiting 10s..."
            sleep 10
          done

      - name: Deployment summary
        run: |
          echo "### Deployment complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** \`${{ steps.tag.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ steps.tag.outputs.image }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**External IP:** \`${{ env.lb_ip }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Pods:**" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          kubectl get pods -n ${{ env.NAMESPACE }} >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Service (LoadBalancer IP):**" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          kubectl get svc app-nspc -n ${{ env.NAMESPACE }} >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      - name: Cleanup
        if: always()
        run: rm -f /tmp/sa-key.json