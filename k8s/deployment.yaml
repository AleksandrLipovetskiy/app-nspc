apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-nspc
  namespace: app-nspc
  labels:
    app: app-nspc
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app-nspc
  template:
    metadata:
      labels:
        app: app-nspc
        version: v1
    spec:
      serviceAccountName: app-nspc-sa  #явный SA вместо default
      automountServiceAccountToken: false

      # Pod-level security context
      securityContext:
        runAsNonRoot: true
        runAsUser: 101                   # nginx user в nginx:alpine
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault

      imagePullSecrets:
        - name: ycr-secret

      containers:
        - name: app-nspc
          image: cr.yandex/b1g0m0akubo6l695q6df/app-nspc:latest  # заменяется CI/CD
          imagePullPolicy: Always

          # Container-level security context
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
              add:
                - NET_BIND_SERVICE      # нужен nginx для порта 80

          ports:
            - containerPort: 80
              name: http

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi

          # nginx нужны writable temp dirs при readOnlyRootFilesystem
          volumeMounts:
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
            - name: nginx-tmp
              mountPath: /tmp

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5

      volumes:
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
        - name: nginx-tmp
          emptyDir: {}